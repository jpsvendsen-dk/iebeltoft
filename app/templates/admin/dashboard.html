{% extends "admin/base_admin.html" %}
{% block title %}Oversigt{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">Oversigt</h1>

<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="text-sm text-gray-500 mb-1">Kommende bookinger</div>
        <div class="text-3xl font-bold text-blue-700">{{ antal_bookinger }}</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="text-sm text-gray-500 mb-1">Sæsonintervaller defineret</div>
        <div class="text-3xl font-bold text-blue-700">{{ antal_saesoner }}</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="text-sm text-gray-500 mb-1">Sæsonpriser sat</div>
        <div class="text-3xl font-bold text-blue-700">{{ antal_priser }} / 5</div>
    </div>
</div>

<div class="mt-8 flex gap-4">
    <a href="/admin/bookinger"
       class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition text-sm">
        Se bookinger
    </a>
    <a href="/admin/saesoner"
       class="bg-white border border-gray-300 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-50 transition text-sm">
        Rediger sæsoner
    </a>
</div>
{% endblock %}
