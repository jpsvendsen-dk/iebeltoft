<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-login — iebeltoft.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-xl shadow-md p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-blue-800 mb-6 text-center">Admin-login</h1>

    {% if fejl %}
    <div class="bg-red-50 border border-red-300 text-red-700 text-sm rounded p-3 mb-4">
        Forkert adgangskode. Prøv igen.
    </div>
    {% endif %}

    <form method="post" action="/admin/login">
        <label class="block text-sm font-medium text-gray-700 mb-1">Adgangskode</label>
        <input
            type="password"
            name="adgangskode"
            autofocus
            class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="••••••••"
        >
        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
            Log ind
        </button>
    </form>
</div>

</body>
</html>
