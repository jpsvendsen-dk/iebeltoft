services:
  - type: web
    name: iebeltoft
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iebeltoft-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false          # Sættes manuelt i Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render genererer automatisk
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: iebeltoft-db
    plan: free
    databaseName: iebeltoft
    user: iebeltoft
